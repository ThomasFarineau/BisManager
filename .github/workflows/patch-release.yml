name: Patch Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Clone project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version
        id: meta
        shell: bash
        run: |
          # Find the latest tag matching x.y.z (ignore suffixes like -14)
          latest=$(git tag -l --sort=-v:refname | grep -E '^[0-9]+\.[0-9]+\.[0-9]+' | head -n1)

          if [ -z "$latest" ]; then
            release_tag="1.0.0"
          else
            # Strip any suffix after x.y.z (e.g. 1.0.13-14 -> 1.0.13)
            base=$(echo "$latest" | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+')
            major=$(echo "$base" | cut -d. -f1)
            minor=$(echo "$base" | cut -d. -f2)
            patch=$(echo "$base" | cut -d. -f3)
            patch=$((patch + 1))
            release_tag="${major}.${minor}.${patch}"
          fi

          echo "Next version: $release_tag"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Create official tag
        shell: bash
        run: |
          git tag "${{ steps.meta.outputs.release_tag }}"
          git push origin "${{ steps.meta.outputs.release_tag }}"

      - name: Checkout official tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.meta.outputs.release_tag }}

      - name: Package and release
        uses: BigWigsMods/packager@v2
        with:
          args: -g retail
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
