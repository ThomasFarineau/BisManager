name: Package and Release

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      providers:
        description: "Providers to scrape (all, archon,murlok,method,wowhead...)"
        required: false
        default: "all"
      base_version:
        description: "Optional base version for the weekly tag (for example: 1.0.2)"
        required: false
        default: ""
  schedule:
    - cron: "0 10 * * 3"
    - cron: "0 11 * * 3"

permissions:
  contents: write

jobs:
  release-from-tag:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Clone project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Package and release
        uses: BigWigsMods/packager@v2
        with:
          args: -g retail
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}

  weekly-release:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Skip non-noon Paris schedule
        id: schedule_guard
        shell: bash
        run: |
          should_release=true
          if [ "${{ github.event_name }}" = "schedule" ]; then
            paris_hour="$(TZ=Europe/Paris date +'%H')"
            if [ "$paris_hour" != "12" ]; then
              should_release=false
            fi
          fi
          echo "should_release=$should_release" >> "$GITHUB_OUTPUT"

      - name: Clone project
        if: steps.schedule_guard.outputs.should_release == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        if: steps.schedule_guard.outputs.should_release == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: tools/package-lock.json

      - name: Install scraper dependencies
        if: steps.schedule_guard.outputs.should_release == 'true'
        working-directory: tools
        run: npm ci

      - name: Run weekly scrape
        if: steps.schedule_guard.outputs.should_release == 'true'
        shell: bash
        working-directory: tools
        run: |
          providers="${{ github.event.inputs.providers }}"
          if [ -n "$providers" ] && [ "$providers" != "all" ]; then
            npx tsx src/scrape.ts --provider "$providers"
          else
            npx tsx src/scrape.ts
          fi

      - name: Prepare weekly tag
        if: steps.schedule_guard.outputs.should_release == 'true'
        id: meta
        shell: bash
        run: |
          input_base="${{ github.event.inputs.base_version }}"
          if [ -n "$input_base" ]; then
            base_version="$input_base"
          else
            latest_stable_tag="$(git tag --list --sort=-v:refname | grep -E '^[v]?[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"
            if [ -n "$latest_stable_tag" ]; then
              base_version="${latest_stable_tag#v}"
            else
              base_version="$(sed -nE 's/^## Version: ([0-9]+\.[0-9]+\.[0-9]+).*$/\1/p' BisManager.toc | head -n 1)"
            fi
          fi

          if [ -z "$base_version" ]; then
            echo "Unable to determine the base version." >&2
            exit 1
          fi

          week_number="$(TZ=Europe/Paris date +'%V' | sed 's/^0//')"
          year_number="$(TZ=Europe/Paris date +'%G')"
          release_tag="${base_version}-${week_number}"

          if git rev-parse --verify "refs/tags/$release_tag" >/dev/null 2>&1; then
            echo "Tag $release_tag already exists." >&2
            exit 1
          fi

          echo "base_version=$base_version" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "release_year=$year_number" >> "$GITHUB_OUTPUT"
          echo "release_week=$week_number" >> "$GITHUB_OUTPUT"

      - name: Commit scraped data
        if: steps.schedule_guard.outputs.should_release == 'true'
        shell: bash
        run: |
          if git diff --quiet -- Data tools/generated; then
            echo "No changes were generated by the scrape."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Data tools/generated
          git commit -m "chore: weekly scrape ${{ steps.meta.outputs.release_tag }}"
          git push

      - name: Create weekly tag
        if: steps.schedule_guard.outputs.should_release == 'true'
        shell: bash
        run: |
          git tag "${{ steps.meta.outputs.release_tag }}"
          git push origin "${{ steps.meta.outputs.release_tag }}"

      - name: Package and release
        if: steps.schedule_guard.outputs.should_release == 'true'
        uses: BigWigsMods/packager@v2
        with:
          args: -g retail
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
